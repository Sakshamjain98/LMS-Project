services:
  redis:
    image: redis:7-alpine
    container_name: lms-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - lms-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lms-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.docker
    environment:
      - NODE_ENV=production
      - PORT=4040
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379
      - TRUST_PROXY=true
      - ENABLE_SWAGGER=false
      - CORS_ORIGIN=http://localhost:5173,http://localhost:80
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "4040:4040"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4040/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - lms-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    container_name: lms-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:8080"
    networks:
      - lms-net

volumes:
  redis_data:

networks:
  lms-net:
    driver: bridge
