      tags: [Admin]
      summary: Update a subscription plan
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePlanRequest"
      responses:
        "200":
          description: Plan updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  plan:
                    $ref: "#/components/schemas/SubscriptionPlan"
    delete:
      tags: [Admin]
      summary: Delete a subscription plan
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Plan deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string

