openapi: 3.0.0
info:
  title: Pharmacist Shubham API
  description: API for educational platform with courses, tests, notes, payments, and user roles.
  version: 1.1.0
  contact:
    name: Support
    email: support@pharmacistshubham.com
servers:
  - url: http://localhost:4040/api
    description: Local development server
  - url: https://pharmacist-shubham-api.onrender.com/api
    description: Production server

tags:
  - name: Auth
    description: Authentication endpoints
  - name: OTP
    description: OTP verification endpoints
  - name: Student
    description: Student dashboard and content access
  - name: Teacher
    description: Teacher content management
  - name: Payment
    description: Subscription and payment processing
  - name: Question
    description: Question management for tests
  - name: Test Attempt
    description: Test taking and results
  - name: Admin
    description: Administrative operations
  - name: User
    description: User profile management
  - name: System
    description: Health check

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # ---------- User ----------
    User:
      type: object
      properties:
        _id:
          type: string
          example: "60d21b4667d0d8992e610c85"
        name:
          type: string
          example: "John Doe"
        email:
          type: string
          format: email
          example: "john@example.com"
        role:
          type: string
          enum: [student, teacher, admin]
          example: "student"
        isApproved:
          type: boolean
          example: true
        avatar:
          type: string
          example: "https://res.cloudinary.com/..."
        phone:
          type: string
          example: "+1234567890"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # ---------- Course ----------
    Course:
      type: object
      properties:
        _id:
          type: string
        title:
          type: string
        description:
          type: string
        isPaid:
          type: boolean
        tags:
          type: array
          items:
            type: string
        educator:
          $ref: "#/components/schemas/User"
        thumbnail:
          $ref: "#/components/schemas/File"
        price:
          type: number
        published:
          type: boolean
        sections:
          type: array
          items:
            $ref: "#/components/schemas/Section"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Section:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        videos:
          type: array
          items:
            $ref: "#/components/schemas/VideoLink"
        notes:
          type: array
          items:
            $ref: "#/components/schemas/File"

    VideoLink:
      type: object
      properties:
        url:
          type: string
          example: "https://youtube.com/..."
        title:
          type: string

    File:
      type: object
      properties:
        url:
          type: string
        publicId:
          type: string
        fileType:
          type: string
          enum: [image, pdf, other]

    # ---------- Note ----------
    Note:
      type: object
      properties:
        _id:
          type: string
        title:
          type: string
        description:
          type: string
        file:
          $ref: "#/components/schemas/File"
        teacherId:
          $ref: "#/components/schemas/User"
        isFree:
          type: boolean
        tags:
          type: array
          items:
            type: string
        downloadCount:
          type: number
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # ---------- Test ----------
    Test:
      type: object
      properties:
        _id:
          type: string
        title:
          type: string
        description:
          type: string
        teacherId:
          $ref: "#/components/schemas/User"
        questions:
          type: array
          items:
            $ref: "#/components/schemas/Question"
        status:
          type: string
          enum: [draft, scheduled, published, closed]
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        duration:
          type: number
          description: Duration in minutes
        totalMarks:
          type: number
        passingMarks:
          type: number
        instructions:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Question:
      type: object
      properties:
        _id:
          type: string
        testId:
          type: string
        questionText:
          type: string
        questionType:
          type: string
          enum: [MCQ, TRUE_FALSE, MULTIPLE_SELECT]
        options:
          type: array
          items:
            $ref: "#/components/schemas/Option"
        correctOptionIndex:
          type: number
        marks:
          type: number
        negativeMarks:
          type: number
        explanation:
          type: string
        difficulty:
          type: string
          enum: [easy, medium, hard]
        tags:
          type: array
          items:
            type: string
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Option:
      type: object
      properties:
        text:
          type: string
        isCorrect:
          type: boolean

    # ---------- Test Attempt ----------
    TestAttempt:
      type: object
      properties:
        _id:
          type: string
        testId:
          type: string
        studentId:
          type: string
        answers:
          type: array
          items:
            $ref: "#/components/schemas/Answer"
        status:
          type: string
          enum: [in_progress, submitted, evaluated, expired]
        startedAt:
          type: string
          format: date-time
        submittedAt:
          type: string
          format: date-time
        totalQuestions:
          type: number
        attemptedQuestions:
          type: number
        correctAnswers:
          type: number
        wrongAnswers:
          type: number
        skippedQuestions:
          type: number
        totalMarks:
          type: number
        marksObtained:
          type: number
        percentage:
          type: number
        timeTaken:
          type: number
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Answer:
      type: object
      properties:
        questionId:
          type: string
        selectedOptionIndex:
          type: number
          nullable: true
        isCorrect:
          type: boolean
        marksObtained:
          type: number
        timeTaken:
          type: number

    # ---------- Payment & Subscription ----------
    Payment:
      type: object
      properties:
        _id:
          type: string
        userId:
          type: string
        orderId:
          type: string
          description: Razorpay order ID (or dev_order_* in DEV mode)
        paymentId:
          type: string
          description: Razorpay payment ID after verification
        plan:
          type: string
          enum: [MONTHLY, QUARTERLY, YEARLY]
        amount:
          type: number
          description: Amount in INR
        amountInPaise:
          type: number
          description: Amount in paise (amount × 100)
        currency:
          type: string
          default: INR
        status:
          type: string
          enum: [PENDING, PENDING_APPROVAL, SUCCESS, FAILED, REFUNDED, REJECTED]
          description: |
            - PENDING: Order created, payment not yet attempted
            - PENDING_APPROVAL: Payment verified by Razorpay, awaiting admin approval
            - SUCCESS: Admin approved, subscription activated
            - FAILED: Signature verification failed
            - REFUNDED: Admin issued refund
            - REJECTED: Admin rejected the payment
        adminApproved:
          type: boolean
          default: false
          description: Whether an admin has approved this payment
        verifiedAt:
          type: string
          format: date-time
          description: When Razorpay signature was successfully verified
        approvedAt:
          type: string
          format: date-time
          description: When admin approved the payment
        rejectedAt:
          type: string
          format: date-time
          description: When admin rejected the payment
        rejectionReason:
          type: string
          description: Reason provided by admin for rejection
        gateway:
          type: string
          default: razorpay
        refundedAt:
          type: string
          format: date-time
        refundReason:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Subscription:
      type: object
      properties:
        _id:
          type: string
        userId:
          type: string
        plan:
          type: string
          enum: [FREE, MONTHLY, QUARTERLY, YEARLY]
        billingCycle:
          type: string
          enum: [MONTHLY, QUARTERLY, YEARLY, ONE_TIME]
        status:
          type: string
          enum: [ACTIVE, EXPIRED, CANCELLED, PENDING]
        price:
          type: number
        currency:
          type: string
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        autoRenew:
          type: boolean
        cancelledAt:
          type: string
          format: date-time
        renewalReminder:
          type: boolean
        paymentHistory:
          type: array
          items:
            type: object
            properties:
              paymentId:
                type: string
              amount:
                type: number
              paidAt:
                type: string
                format: date-time
              plan:
                type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # ---------- OTP ----------
    Otp:
      type: object
      properties:
        email:
          type: string
        otp:
          type: string
        expiresAt:
          type: string
          format: date-time
        attempts:
          type: number

    # ---------- Blog ----------
    Blog:
      type: object
      properties:
        _id:
          type: string
        title:
          type: string
        content:
          type: string
        published:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # ---------- News ----------
    News:
      type: object
      properties:
        _id:
          type: string
        title:
          type: string
        content:
          type: string
        author:
          $ref: "#/components/schemas/User"
        published:
          type: boolean
          default: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # ---------- Comment ----------
    Comment:
      type: object
      properties:
        _id:
          type: string
        user:
          $ref: "#/components/schemas/User"
        blog:
          $ref: "#/components/schemas/Blog"
        comment:
          type: string
        approved:
          type: boolean
          default: false
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # ---------- Subscription Plan ----------
    SubscriptionPlan:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
        price:
          type: number
        duration:
          type: number
          description: Duration in days
        features:
          type: array
          items:
            type: string
        active:
          type: boolean
          default: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # ---------- Invoice ----------
    Invoice:
      type: object
      properties:
        _id:
          type: string
        userId:
          type: string
        invoiceNumber:
          type: string
        paymentId:
          type: string
        plan:
          type: string
          enum: [MONTHLY, QUARTERLY, YEARLY]
        amount:
          type: number
        gst:
          type: number
        total:
          type: number
        billingPeriod:
          type: object
          properties:
            start:
              type: string
              format: date-time
            end:
              type: string
              format: date-time
        status:
          type: string
          enum: [PAID, REFUNDED]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # ---------- Question Analytics ----------
    QuestionAnalytics:
      type: object
      properties:
        testId:
          type: string
        questionId:
          type: string
        totalAttempts:
          type: number
        correctAttempts:
          type: number
        incorrectAttempts:
          type: number
        skipped:
          type: number
        avgTimeSpent:
          type: number

    # ---------- Common Responses ----------
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object

    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
        stack:
          type: string
          description: Only in development

    # ---------- Request Bodies ----------
    RegisterRequest:
      type: object
      required:
        - name
        - email
        - password
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        role:
          type: string
          enum: [student, teacher]
          default: student

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    GoogleLoginRequest:
      type: object
      required:
        - token
        - role
      properties:
        token:
          type: string
          description: Google ID token
        role:
          type: string
          enum: [student, teacher]

    ForgotPasswordRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email

    ResetPasswordRequest:
      type: object
      required:
        - token
        - newPassword
      properties:
        token:
          type: string
        newPassword:
          type: string
          format: password

    OtpSendRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email

    OtpVerifyRequest:
      type: object
      required:
        - email
        - otp
        - role
      properties:
        email:
          type: string
          format: email
        otp:
          type: string
        role:
          type: string
          enum: [student, teacher]

    CreateCourseRequest:
      type: object
      required:
        - title
      properties:
        title:
          type: string
        description:
          type: string
        isPaid:
          type: boolean
        tags:
          type: string
          description: Comma-separated tags
        price:
          type: number
        thumbnail:
          type: string
          format: binary
          description: Image file

    CreateSectionRequest:
      type: object
      required:
        - title
      properties:
        title:
          type: string
        description:
          type: string

    AddVideoLinkRequest:
      type: object
      required:
        - url
        - title
      properties:
        url:
          type: string
        title:
          type: string

    CreateTestRequest:
      type: object
      required:
        - title
        - duration
      properties:
        title:
          type: string
        description:
          type: string
        duration:
          type: number
          description: Duration in minutes
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        instructions:
          type: string
        passingMarks:
          type: number

    CreateQuestionRequest:
      type: object
      required:
        - questionText
        - options
        - correctOptionIndex
      properties:
        questionText:
          type: string
        questionType:
          type: string
          enum: [MCQ, TRUE_FALSE, MULTIPLE_SELECT]
          default: MCQ
        options:
          type: array
          items:
            type: object
            properties:
              text:
                type: string
              isCorrect:
                type: boolean
        correctOptionIndex:
          type: number
        marks:
          type: number
          default: 1
        negativeMarks:
          type: number
          default: 0
        explanation:
          type: string
        difficulty:
          type: string
          enum: [easy, medium, hard]
          default: medium
        tags:
          type: array
          items:
            type: string

    BulkCreateQuestionsRequest:
      type: object
      required:
        - questions
      properties:
        questions:
          type: array
          items:
            $ref: "#/components/schemas/CreateQuestionRequest"

    TestConfigRequest:
      type: object
      required:
        - duration
      properties:
        sections:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              questionIds:
                type: array
                items:
                  type: string
              marksPerQuestion:
                type: number
        duration:
          type: number
        negativeMarking:
          type: object
          properties:
            enabled:
              type: boolean
            value:
              type: number

    PublishTestRequest:
      type: object
      properties:
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time

    SubmitAnswerRequest:
      type: object
      required:
        - questionId
        - selectedOptionIndex
        - timeTaken
      properties:
        questionId:
          type: string
        selectedOptionIndex:
          type: number
          nullable: true
        timeTaken:
          type: number

    SubmitTestRequest:
      type: object
      properties:
        answers:
          type: array
          items:
            $ref: "#/components/schemas/SubmitAnswerRequest"

    CreateOrderRequest:
      type: object
      required:
        - planId
      properties:
        planId:
          type: string
          enum: [MONTHLY, QUARTERLY, YEARLY]

    VerifyPaymentRequest:
      type: object
      required:
        - razorpay_order_id
      properties:
        razorpay_payment_id:
          type: string
          description: Required in PRODUCTION mode; optional in DEV mode
        razorpay_order_id:
          type: string
        razorpay_signature:
          type: string
          description: Required in PRODUCTION mode; skipped in DEV mode

    RejectPaymentRequest:
      type: object
      properties:
        reason:
          type: string
          description: Optional reason for rejecting the payment
          example: "Suspicious transaction detected"

    UpdateRoleRequest:
      type: object
      required:
        - role
      properties:
        role:
          type: string
          enum: [student, teacher, admin]

    CreateBlogRequest:
      type: object
      required:
        - title
        - content
      properties:
        title:
          type: string
        content:
          type: string
        published:
          type: boolean
          default: true

    # ---------- New Admin Request Bodies ----------
    CreateNewsRequest:
      type: object
      required:
        - title
        - content
      properties:
        title:
          type: string
        content:
          type: string
        published:
          type: boolean
          default: true

    UpdateNewsRequest:
      type: object
      properties:
        title:
          type: string
        content:
          type: string
        published:
          type: boolean

    CreatePlanRequest:
      type: object
      required:
        - name
        - price
        - duration
      properties:
        name:
          type: string
        price:
          type: number
        duration:
          type: number
          description: Duration in days
        features:
          type: array
          items:
            type: string
        active:
          type: boolean
          default: true

    UpdatePlanRequest:
      type: object
      properties:
        name:
          type: string
        price:
          type: number
        duration:
          type: number
        features:
          type: array
          items:
            type: string
        active:
          type: boolean

    # ---------- Teacher Note Request Bodies ----------
    CreateNoteRequest:
      type: object
      required:
        - title
        - file
      properties:
        title:
          type: string
        description:
          type: string
        isFree:
          type: boolean
          default: false
        tags:
          type: string
          description: Comma-separated tags
        file:
          type: string
          format: binary
          description: Note file (PDF)

    UpdateNoteRequest:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        isFree:
          type: boolean
        tags:
          type: string
          description: Comma-separated tags
        file:
          type: string
          format: binary
          description: Note file (PDF)

  parameters:
    courseId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Course ID
    sectionId:
      name: sectionId
      in: path
      required: true
      schema:
        type: string
      description: Section ID
    testId:
      name: testId
      in: path
      required: true
      schema:
        type: string
      description: Test ID
    questionId:
      name: questionId
      in: path
      required: true
      schema:
        type: string
      description: Question ID
    attemptId:
      name: attemptId
      in: path
      required: true
      schema:
        type: string
      description: Test attempt ID
    userId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: User ID
    blogId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Blog ID
    videoIndex:
      name: videoIndex
      in: path
      required: true
      schema:
        type: integer
      description: Index of video in section's videos array
    newsId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: News ID
    commentId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Comment ID
    planId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Subscription plan ID
    paymentId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Payment ID

paths:
  # ---------- Auth ----------
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: User created successfully
                  user:
                    $ref: "#/components/schemas/User"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Too many requests

  /auth/login:
    post:
      tags: [Auth]
      summary: Login with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  token:
                    type: string
                  user:
                    $ref: "#/components/schemas/User"
        "401":
          description: Invalid credentials

  /auth/google:
    post:
      tags: [Auth]
      summary: Login or register with Google
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleLoginRequest"
      responses:
        "200":
          description: Google login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  token:
                    type: string
                  user:
                    $ref: "#/components/schemas/User"

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request password reset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "200":
          description: Reset email sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset password with token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Password reset successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string

  # ---------- OTP ----------
  /auth/otp/send:
    post:
      tags: [OTP]
      summary: Send OTP to email
