  # ---------- Payment ----------
  /payment/plans:
    get:
      tags: [Payment]
      summary: Get available subscription plans
      responses:
        "200":
          description: List of plans
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  plans:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          enum: [MONTHLY, QUARTERLY, YEARLY]
                        name:
                          type: string
                        price:
                          type: number
                          description: Price in INR
                        duration:
                          type: string

  /payment/create-order:
    post:
      tags: [Payment]
      summary: Create a Razorpay payment order
      description: |
        Creates a payment order. In **PRODUCTION** mode a real Razorpay order is created and
        `razorpayOrder` is returned. In **DEV** mode a synthetic order ID is generated without
        calling the Razorpay API.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "200":
          description: Order created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  order:
                    type: object
                    properties:
                      orderId:
                        type: string
                        description: Use this as `razorpay_order_id` in verify call
                      amount:
                        type: number
                        description: Amount in INR
                      amountInPaise:
                        type: number
                        description: Amount × 100, pass to Razorpay checkout
                      currency:
                        type: string
                        example: INR
                      plan:
                        type: string
                      planName:
                        type: string
                      duration:
                        type: string
                      razorpayKeyId:
                        type: string
                        description: Razorpay key_id to initialise checkout on frontend
                      razorpayOrder:
                        type: object
                        description: Full Razorpay order object (PRODUCTION only)
        "400":
          description: Invalid plan selected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized

  /payment/verify:
    post:
      tags: [Payment]
      summary: Verify Razorpay payment after checkout
      description: |
        Verifies the Razorpay signature (skipped in DEV mode) and moves the payment to
        **PENDING_APPROVAL** status. The subscription is **not** activated until an admin
        approves the payment via `PUT /admin/payments/{id}/approve`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyPaymentRequest"
      responses:
        "200":
          description: Payment verified — awaiting admin approval
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                    example: "Payment verified successfully. Awaiting admin approval before subscription is activated."
                  pendingAdminApproval:
                    type: boolean
                    example: true
                  dev:
                    type: boolean
                    description: Present and true only in DEV mode
                  alreadyProcessed:
                    type: boolean
                    description: True if this order was already verified before
        "400":
          description: Invalid or missing payment data / signature mismatch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Payment does not belong to the requesting user

  /payment/pending-approval:
    get:
      tags: [Payment]
      summary: "(Admin) Get all payments pending admin approval"
      description: Returns payments in `PENDING_APPROVAL` status, populated with user info.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of payments awaiting approval
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  payments:
                    type: array
                    items:
                      $ref: "#/components/schemas/Payment"
        "403":
          description: Admin access required

  /payment/{id}/approve:
    put:
      tags: [Payment]
      summary: "(Admin) Approve a payment and activate subscription"
      description: |
        Marks the payment as `SUCCESS`, sets `adminApproved: true`, and queues subscription
        activation via BullMQ. Only works on payments in `PENDING_APPROVAL` state.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/paymentId"
      responses:
        "200":
          description: Payment approved and subscription queued for activation
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                    example: "Payment approved and subscription activated"
                  payment:
                    $ref: "#/components/schemas/Payment"
        "400":
          description: Payment is not in PENDING_APPROVAL state
        "403":
          description: Admin access required
        "404":
          description: Payment not found

  /payment/{id}/reject:
    put:
      tags: [Payment]
      summary: "(Admin) Reject a pending payment"
      description: |
        Marks the payment as `REJECTED` and stores the optional rejection reason.
        Only works on payments in `PENDING_APPROVAL` state.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/paymentId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectPaymentRequest"
      responses:
        "200":
          description: Payment rejected
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                    example: "Payment rejected"
                  payment:
                    $ref: "#/components/schemas/Payment"
        "400":
          description: Payment is not in PENDING_APPROVAL state
        "403":
          description: Admin access required
        "404":
          description: Payment not found

