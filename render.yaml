services:
  - type: web
    name: lms-backend
    runtime: node
    rootDir: backend
    plan: free
    autoDeploy: true
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4040
      - key: ENABLE_SWAGGER
        value: "false"
      - key: TRUST_PROXY
        value: "true"
      - key: REQUEST_SIZE_LIMIT
        value: 10mb
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        sync: false
      - key: REDIS_URL
        sync: false
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: OTP_EXPIRY_MINUTES
        value: 10
      - key: RESEND_API_KEY
        value: re_AT9nCVgH_5DVtPZh9oP1cfH3ocYVSCx1B
      - key: EMAIL_FROM
        value: pharmacistshubhamsir@gmail.com
      - key: FRONTEND_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: PAYMENT_MODE
        value: LIVE
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
