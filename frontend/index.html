<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Primary -->
    <title>PS Classes — Pharmacy Test Series, Mock Tests & Exam Prep</title>
    <meta
      name="description"
      content="PS Classes is a structured pharmacy learning platform. Practise GPAT, NIPER, drug-inspector and other pharmacy mocks with proctored test series, leaderboards, and instant analytics."
    />
    <meta
      name="keywords"
      content="PS Classes, pharmacy test series, GPAT mock test, NIPER mock test, pharmacy exam prep, drug inspector exam, proctored online test, pharmacy MCQs, pharmacist coaching"
    />
    <meta name="author" content="PS Classes" />
    <meta name="theme-color" content="#0a0d12" />
    <meta name="color-scheme" content="dark light" />
    <link rel="canonical" href="https://psclasses.in/" />

    <!-- Icons -->
    <link rel="icon" type="image/jpeg" href="/PS Logo_Dark bg.jpg" />
    <link rel="apple-touch-icon" href="/PS Logo_Dark bg.jpg" />

    <!-- Robots & locale -->
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta http-equiv="content-language" content="en-IN" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PS Classes" />
    <meta property="og:title" content="PS Classes — Pharmacy Test Series & Exam Prep" />
    <meta
      property="og:description"
      content="Crack GPAT, NIPER, and pharmacy entrances faster — practise on a proctored test platform with instant analytics, leaderboards, and AIRs."
    />
    <meta property="og:image" content="/logo.png" />
    <meta property="og:image:alt" content="PS Classes logo" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:url" content="https://psclasses.in/" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PS Classes — Pharmacy Test Series & Exam Prep" />
    <meta
      name="twitter:description"
      content="Practise GPAT, NIPER, and pharmacy mocks with proctored test series, leaderboards, and instant analytics."
    />
    <meta name="twitter:image" content="/logo.png" />

    <!-- Preconnect to external services we hit on first paint -->
    <link rel="preconnect" href="https://www.youtube.com" />
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />
    <link rel="preconnect" href="https://checkout.razorpay.com" />

    <!-- Structured data — helps search engines understand the org & site -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "EducationalOrganization",
        "name": "PS Classes",
        "url": "https://psclasses.in/",
        "logo": "https://psclasses.in/logo.png",
        "sameAs": [],
        "description": "PS Classes is an online pharmacy learning platform offering proctored test series, mock exams, leaderboards and analytics for GPAT, NIPER, and other pharmacy competitive exams."
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "PS Classes",
        "url": "https://psclasses.in/",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://psclasses.in/?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>

    <style>
      body {
        background-color: black;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
